<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>
            {% block title %}
                AI Attendance Portal
            {% endblock %}
        </title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js">
        </script>
    </head>
    <body>
        <div class="bg">
            <i>
            </i>
            <i>
            </i>
            <i>
            </i>
        </div>
        <nav>
            <a class="logo" href="/">
                🎓 AI
                <span>
                    Portal
                </span>
            </a>
            <div class="links">
                <a href="/">
                    Home
                </a>
                {% if session.roll %}
                    <a href="/attendance">
                        Attendance
                    </a>
                    <a href="/predict">
                        Prediction
                    </a>
                    <a href="/notes">
                        Notes
                    </a>
                {% endif %}
                <a href="/contact">
                    Contact
                </a>
                {% if session.roll %}
                    <a class="btn small" href="/logout">
                        Logout (
                        {{ session.name }}
                        )
                    </a>
                {% else %}
                    <a class="btn small" href="/login">
                        Login
                    </a>
                {% endif %}
            </div>
        </nav>
        {% for m in get_flashed_messages() %}
            <div class="flash">
                {{ m }}
            </div>
        {% endfor %}
        <main>
            {% block content %}
            {% endblock %}
        </main>
        <footer>
            © 2026 AI College Attendance System
        </footer>
        <script>
            document.querySelectorAll('.card:not(.form)').forEach((c,i)=>{c.classList.add('tilt');c.style.animationDelay=i*.08+'s';
c.onmousemove=e=>{let r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.setProperty('--ry',x*14+'deg');c.style.setProperty('--rx',-y*14+'deg')};
c.onmouseleave=()=>{c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')}})
        </script>
    </body>
</html>
