{% extends "base.html" %}
{% block title %}
    Teacher Login
{% endblock %}
{% block content %}
    <div class="card form">
        <h2>
            👩‍🏫 Teacher Login
        </h2>
        <form method="POST">
            <input
            type="text"
            name="teacher_id"
            placeholder="Teacher ID"
            required
        >
            <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >
            <button class="btn" type="submit">
                Login
            </button>
        </form>
        <a href="/login" style="color:#94a3b8">
            ← Student Login
        </a>
    </div>
{% endblock %}
